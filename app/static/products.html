<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gear Search</title>
<style>
  :root {
    --slope-navy: #16202c;
    --slope-navy-light: #202f40;
    --ice: #7fd7e8;
    --ice-dim: #4a8f9e;
    --snow: #f3f6f8;
    --flag-orange: #ff6b35;
    --line: #2c3f52;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--slope-navy);
    background-image:
      linear-gradient(180deg, var(--slope-navy) 0%, #0f1720 100%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--snow);
    padding: 48px 24px 80px;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  header .eyebrow {
    color: var(--ice);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 12px;
    font-weight: 600;
  }

  header h1 {
    font-size: 32px;
    margin: 8px 0 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .search-bar {
    display: flex;
    gap: 12px;
    background: var(--slope-navy-light);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }

  .search-bar input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--snow);
    font-size: 16px;
    padding: 12px 14px;
  }

  .search-bar input::placeholder {
    color: #7c8ea0;
  }

  #query {
    flex: 3 1 320px;
    border-right: 1px solid var(--line);
  }

  #location {
    flex: 1 1 180px;
  }

  .search-bar button {
    flex: 0 0 auto;
    background: var(--flag-orange);
    color: #1a1005;
    border: none;
    border-radius: 10px;
    padding: 0 26px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.15s ease;
  }

  .search-bar button:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
  }

  .search-bar button:disabled {
    opacity: 0.6;
    cursor: default;
    transform: none;
  }

  #status {
    text-align: center;
    color: #8fa3b5;
    min-height: 24px;
    margin-bottom: 24px;
    font-size: 14px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }

  .card {
    display: flex;
    flex-direction: column;
    background: var(--slope-navy-light);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    text-decoration: none;
    color: var(--snow);
    aspect-ratio: 1 / 1;
    position: relative;
    overflow: hidden;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .card:hover {
    border-color: var(--ice);
    transform: translateY(-3px);
  }

  .card .tag {
    position: absolute;
    top: 14px;
    right: 14px;
    background: var(--flag-orange);
    color: #1a1005;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
  }

  .card .thumb {
    width: 100%;
    height: 45%;
    object-fit: contain;
    margin-bottom: 12px;
    background: #fff;
    border-radius: 10px;
  }

  .card .title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: auto;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card .meta {
    margin-top: 10px;
  }

  .card .store {
    color: var(--ice);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .card .price-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 4px;
  }

  .card .price {
    font-size: 20px;
    font-weight: 700;
  }

  .card .old-price {
    font-size: 13px;
    color: #7c8ea0;
    text-decoration: line-through;
  }

  .empty, .error {
    text-align: center;
    color: #7c8ea0;
    padding: 60px 20px;
    grid-column: 1 / -1;
  }

  .error { color: #ff8a7a; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Gear Finder</div>
      <h1>Find who's selling it</h1>
    </header>

    <div class="search-bar">
      <input id="query" type="text" placeholder="Type whatever you're searching for — e.g. Vans Infuse Snowboard Boot" />
      <input id="location" type="text" placeholder="Location (optional)" />
      <button id="searchBtn">Search</button>
    </div>

    <div id="status"></div>
    <div class="grid" id="results"></div>
  </div>

<script>
  // Point this at wherever your FastAPI server is running
  const API_BASE = "";

  const queryInput = document.getElementById("query");
  const locationInput = document.getElementById("location");
  const searchBtn = document.getElementById("searchBtn");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");

  async function runSearch() {
    const q = queryInput.value.trim();
    if (!q) {
      statusEl.textContent = "Type something to search for first.";
      return;
    }

    searchBtn.disabled = true;
    statusEl.textContent = "Searching...";
    resultsEl.innerHTML = "";

    const params = new URLSearchParams({ q });
    const location = locationInput.value.trim();
    if (location) params.set("location", location);

    try {
      const res = await fetch(`${API_BASE}/get_products?${params.toString()}`);

      if (!res.ok) {
          const error = await res.json();   // Read FastAPI's error response
          throw new Error(error.detail);    // Use the "detail" field
      }

      const data = await res.json();
      renderResults(data.results || []);

    } catch (err) {
        resultsEl.innerHTML = `
            <div class="error">${err.message}</div>
        `;
        statusEl.textContent = "";
        return;
    }

    searchBtn.disabled = false;
  }

  function renderResults(results) {
    if (!results.length) {
      resultsEl.innerHTML = `<div class="empty">No results found. Try a different search.</div>`;
      statusEl.textContent = "";
      return;
    }

    statusEl.textContent = `${results.length} result${results.length === 1 ? "" : "s"} found`;

    resultsEl.innerHTML = results.map(item => `
      <a class="card" href="${item.link || '#'}" target="_blank" rel="noopener noreferrer">
        ${item.tag ? `<div class="tag">${escapeHtml(item.tag)}</div>` : ""}
        ${item.thumbnail ? `<img class="thumb" src="${item.thumbnail}" alt="" />` : ""}
        <div class="title">${escapeHtml(item.title || "Untitled")}</div>
        <div class="meta">
          <div class="store">${escapeHtml(item.store || "Unknown store")}</div>
          <div class="price-row">
            <span class="price">${item.price ? escapeHtml(item.price) : "—"}</span>
            ${item.old_price ? `<span class="old-price">${escapeHtml(item.old_price)}</span>` : ""}
          </div>
        </div>
      </a>
    `).join("");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  searchBtn.addEventListener("click", runSearch);
  queryInput.addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });
  locationInput.addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });
</script>
</body>
</html>
