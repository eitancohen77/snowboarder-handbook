<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US Ski Resorts Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --ink: #2b2621;
    --muted: #6b6255;
    --card-bg: #fdfbf6;
    --card-line: #d8cfbf;
    --flag-orange: #d9622b;
    --dot: #2a6f4f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #0f1720;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--ink);
  }

  header {
    text-align: center;
    padding: 20px 16px 14px;
  }

  header .eyebrow {
    color: var(--flag-orange);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 12px;
    font-weight: 700;
  }

  header h1 {
    font-size: 26px;
    margin: 6px 0 0;
    font-weight: 700;
    color: white;
  }

  header p {
    color: var(--muted);
    font-size: 13px;
    margin: 6px 0 0;
    color: rgba(255, 255, 255, 0.514);
  }

  #map {
    width: 100%;
    height: 82vh;
    min-height: 500px;
    background: #eae4d3;
  }

  /* Visible dot: small, purely decorative */
  .resort-dot-visual {
    fill: var(--dot);
    stroke: #33010197;
    stroke-width: 1.5;
    pointer-events: none;
    transition: fill 0.12s ease;
  }

  /* Invisible larger circle underneath that actually catches the hover/click */
  .resort-dot-hit {
    fill: #000;
    fill-opacity: 0;
    stroke: none;
    cursor: pointer;
  }

  /* Hover card that appears under the circle */
  .resort-hover-card {
    background: var(--card-bg);
    border: 1px solid var(--card-line);
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    font-family: inherit;
    min-width: 160px;
  }
  .resort-hover-card .name {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .resort-hover-card .state {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .resort-hover-card a {
    display: inline-block;
    background: var(--flag-orange);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    padding: 5px 10px;
    border-radius: 6px;
  }
  .resort-hover-card a:hover {
    filter: brightness(1.08);
  }

  .leaflet-popup-content-wrapper {
    background: transparent;
    box-shadow: none;
    padding: 0;
  }
  .leaflet-popup-tip {
    display: none;
  }
  .leaflet-popup-content {
    margin: 0;
  }
  .leaflet-popup-close-button {
    display: none;
  }

  /* ===== Side panel for rated resorts ===== */
  #side-panel {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: 360px;
    max-width: 90vw;
    background: var(--card-bg);
    box-shadow: 4px 0 24px rgba(0,0,0,0.18);
    z-index: 1200;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    overflow-y: auto;
    font-family: inherit;
  }
  #side-panel.open {
    transform: translateX(0);
  }

  #side-panel .panel-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: none;
    border: none;
    font-size: 20px;
    color: var(--muted);
    cursor: pointer;
    line-height: 1;
  }
  #side-panel .panel-close:hover { color: var(--ink); }

  .panel-hero {
    padding: 22px 22px 16px;
    border-bottom: 1px solid var(--card-line);
  }
  .panel-hero .breadcrumb {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .panel-hero h2 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 800;
  }
  .panel-hero .location {
    font-size: 13px;
    color: var(--muted);
  }

  .rank-badges {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .rank-badge {
    background: #f4ede0;
    border: 1px solid var(--card-line);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
  }
  .rank-badge b {
    display: block;
    font-size: 15px;
    color: var(--flag-orange);
  }

  .panel-section {
    padding: 16px 22px;
    border-bottom: 1px solid var(--card-line);
  }
  .panel-section h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 12px;
  }

  .diff-bar {
    display: flex;
    height: 10px;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .diff-bar span.beg { background: #2f9e44; }
  .diff-bar span.int { background: #1c7ed6; }
  .diff-bar span.adv { background: #2b2621; }
  .diff-legend {
    display: flex;
    gap: 14px;
    font-size: 11px;
    color: var(--muted);
  }
  .diff-legend span::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    margin-right: 5px;
    vertical-align: middle;
  }
  .diff-legend .l-beg::before { background: #2f9e44; }
  .diff-legend .l-int::before { background: #1c7ed6; }
  .diff-legend .l-adv::before { background: #2b2621; }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .stat-grid .stat {
    background: #f6f2e8;
    border-radius: 8px;
    padding: 8px 10px;
  }
  .stat-grid .stat .v {
    font-size: 15px;
    font-weight: 700;
  }
  .stat-grid .stat .l {
    font-size: 11px;
    color: var(--muted);
  }

  .score-row {
    display: grid;
    grid-template-columns: 100px 1fr 24px;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
    font-size: 12px;
  }
  .score-row .track {
    background: #eee4d3;
    border-radius: 5px;
    height: 7px;
    overflow: hidden;
  }
  .score-row .fill {
    background: var(--flag-orange);
    height: 100%;
    border-radius: 5px;
  }
  .score-row .num {
    text-align: right;
    color: var(--muted);
  }

  .total-score {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 14px;
  }
  .total-score .big {
    font-size: 30px;
    font-weight: 800;
    color: var(--flag-orange);
  }
  .total-score .small {
    font-size: 12px;
    color: var(--muted);
  }

  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .pill {
    background: #f6f2e8;
    border: 1px solid var(--card-line);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11px;
    color: var(--ink);
  }

  .panel-cta {
    padding: 18px 22px 26px;
  }
  .panel-cta a {
    display: block;
    text-align: center;
    background: var(--flag-orange);
    color: #fbfbfb;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    padding: 12px;
    border-radius: 10px;
  }
  .panel-cta a:hover { filter: brightness(1.08); }

  /* Rated-resort dot styling (gold) */
  .resort-dot-visual-rated {
    fill: var(--flag-orange);
    stroke: #ffa449;
    stroke-width: 1.5;
    pointer-events: none;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Trail Map</div>
  <h1>US Ski Resorts</h1>
  <p>Hover a dot for details &middot; gold dots have full Peak Ratings &mdash; click to open</p>
</header>

<div id="side-panel"></div>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
  import { RESORTS, RANKED } from "/static/js/resortsData.js"

  const map = L.map('map', {
    zoomControl: true,
    minZoom: 4,
    maxZoom: 13
  }).setView([39.5, -98.35], 4.3);

  // Natural land-color terrain (greens/browns, no snow-white styling)
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Source: US National Park Service',
    maxZoom: 8
  }).addTo(map);

  // Place-name / boundary labels layered on top, dimmed down since they're secondary
  const labelsLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 13,
    opacity: 0.35
  }).addTo(map);

  // Restrict panning/zooming to the US (CONUS + Alaska + Hawaii)
  const US_BOUNDS = L.latLngBounds([15, -180], [72, -60]);
  map.setMaxBounds(US_BOUNDS.pad(0.05));
  map.on('drag', () => map.panInsideBounds(US_BOUNDS, { animate: false }));

  // Timer used to add a tiny grace-period before closing, so moving the
  // mouse from the dot onto the "Visit site" link doesn't close the card.
  let closeTimer = null;
  let currentlyOpen = null; // the hit-target marker whose popup is showing

  // Coordinates that belong to a rated resort — skip plain markers there
  // so we don't stack a plain dot on top of the gold one.
  const rankedCoordKeys = new Set(RANKED.map(r => r.lat + ',' + r.lon));

  RESORTS.forEach(resort => {
    const coordKey = resort.lat + ',' + resort.lon;
    if (rankedCoordKeys.has(coordKey)) return; // handled by the rated loop below

    // Small visible dot (purely decorative, doesn't catch mouse events)
    L.circleMarker([resort.lat, resort.lon], {
      radius: 4,
      className: 'resort-dot-visual',
      weight: 1.5,
      interactive: false
    }).addTo(map);

    // Larger invisible circle on top — this is the actual hover/click target,
    // much easier to hit than the tiny visible dot.
    const hitTarget = L.circleMarker([resort.lat, resort.lon], {
      radius: 14,
      className: 'resort-dot-hit'
    }).addTo(map);

    const cardHtml = `
      <div class="resort-hover-card" data-resort-card>
        <div class="name">${escapeHtml(resort.name)}</div>
        <div class="state">${escapeHtml(resort.state)}</div>
        <a href="#" data-open-panel data-resort-name="${escapeHtml(resort.name)}" data-rated="false">View details &rarr;</a>
      </div>
    `;

    hitTarget.bindPopup(cardHtml, {
      closeButton: false,
      autoClose: false,
      closeOnClick: false,
      offset: [0, 10]
    });

    hitTarget.on('mouseover', function () {
      clearTimeout(closeTimer);
      // Only one card visible at a time: close whatever was open, instantly
      if (currentlyOpen && currentlyOpen !== this) {
        currentlyOpen.closePopup();
      }
      currentlyOpen = this;
      this.openPopup();
    });
    hitTarget.on('mouseout', function () {
      const marker = this;
      closeTimer = setTimeout(() => {
        marker.closePopup();
        if (currentlyOpen === marker) currentlyOpen = null;
      }, 150);
    });

    // Click: open the side panel (shows "no data" state with a link to the site)
    hitTarget.on('click', function () {
      openSidePanel(resort, false);
    });
  });

  // ===== Rated resorts: gold dots that open the side panel on click =====
  RANKED.forEach(resort => {
    L.circleMarker([resort.lat, resort.lon], {
      radius: 5,
      className: 'resort-dot-visual-rated',
      weight: 1.5,
      interactive: false
    }).addTo(map);

    const hitTarget = L.circleMarker([resort.lat, resort.lon], {
      radius: 15,
      className: 'resort-dot-hit'
    }).addTo(map);

    const cardHtml = `
      <div class="resort-hover-card" data-resort-card>
        <div class="name">${escapeHtml(resort.name)}</div>
        <div class="state">${escapeHtml(resort.city)}, ${escapeHtml(resort.state)}</div>
        <a href="#" data-open-panel data-resort-name="${escapeHtml(resort.name)}" data-rated="true">Peak Rating &rarr;</a>
      </div>
    `;

    hitTarget.bindPopup(cardHtml, {
      closeButton: false,
      autoClose: false,
      closeOnClick: false,
      offset: [0, 10]
    });

    hitTarget.on('mouseover', function () {
      clearTimeout(closeTimer);
      if (currentlyOpen && currentlyOpen !== this) {
        currentlyOpen.closePopup();
      }
      currentlyOpen = this;
      this.openPopup();
    });
    hitTarget.on('mouseout', function () {
      const marker = this;
      closeTimer = setTimeout(() => {
        marker.closePopup();
        if (currentlyOpen === marker) currentlyOpen = null;
      }, 150);
    });

    hitTarget.on('click', function () {
      openSidePanel(resort, true);
    });
  });

  // Keep the card open if the mouse moves onto the card itself
  // (e.g. to click the "Visit site" link) instead of closing immediately.
  map.on('popupopen', function (e) {
    const el = e.popup.getElement();
    if (!el) return;
    el.addEventListener('mouseenter', () => clearTimeout(closeTimer));
    el.addEventListener('mouseleave', () => {
      closeTimer = setTimeout(() => {
        map.closePopup(e.popup);
        currentlyOpen = null;
      }, 150);
    });
  });

  // ===== Side panel rendering =====
  const panelEl = document.getElementById('side-panel');

  const SCORE_LABELS = {
    snow: 'Snow', resiliency: 'Resiliency', size: 'Size',
    terrainDiversity: 'Terrain Diversity', challenge: 'Challenge',
    lifts: 'Lifts', crowdFlow: 'Crowd Flow', facilities: 'Facilities',
    navigation: 'Navigation', mountainAesthetic: 'Aesthetic'
  };

  function pct(n) { return Math.round((n || 0) * 100) + '%'; }

  function openSidePanel(r, rated) {
    if (!rated) {
      panelEl.innerHTML = `
        <button class="panel-close" data-close-panel>&times;</button>
        <div class="panel-hero">
          <div class="breadcrumb">United States &rsaquo; ${escapeHtml(r.state)}</div>
          <h2>${escapeHtml(r.name)}</h2>
          <div class="location">${escapeHtml(r.state)}</div>
        </div>
        <div class="panel-section" style="border-bottom:none;">
          <p style="color:var(--muted); font-size:13px; line-height:1.6; margin:0;">
            No Peak Rating data on this mountain yet.
          </p>
        </div>
        <div class="panel-cta">
          <a href="${r.website}" target="_blank" rel="noopener noreferrer">Visit ${escapeHtml(r.name)} &rarr;</a>
        </div>
      `;
      panelEl.classList.add('open');
      return;
    }

    const scoreRows = Object.entries(SCORE_LABELS).map(([key, label]) => {
      const val = r.scores[key] ?? 0;
      return `
        <div class="score-row">
          <div>${label}</div>
          <div class="track"><div class="fill" style="width:${val * 10}%"></div></div>
          <div class="num">${val}</div>
        </div>
      `;
    }).join('');

    panelEl.innerHTML = `
      <button class="panel-close" data-close-panel>&times;</button>
      <div class="panel-hero">
        <div class="breadcrumb">United States &rsaquo; ${escapeHtml(r.state)}</div>
        <h2>${escapeHtml(r.name)}</h2>
        <div class="location">${escapeHtml(r.city)}, ${escapeHtml(r.state)}</div>
        <div class="rank-badges">
          <div class="rank-badge"><b>#${r.overallRank}</b>Overall Rank</div>
          <div class="rank-badge"><b>#${r.regionalRank}</b>${escapeHtml(r.region)} Rank</div>
        </div>
      </div>

      <div class="panel-section">
        <h3>Terrain Mix</h3>
        <div class="diff-bar">
          <span class="beg" style="width:${r.beginnerPct * 100}%"></span>
          <span class="int" style="width:${r.intermediatePct * 100}%"></span>
          <span class="adv" style="width:${r.advancedPct * 100}%"></span>
        </div>
        <div class="diff-legend">
          <span class="l-beg">Beginner ${pct(r.beginnerPct)}</span>
          <span class="l-int">Intermediate ${pct(r.intermediatePct)}</span>
          <span class="l-adv">Advanced ${pct(r.advancedPct)}</span>
        </div>
      </div>

      <div class="panel-section">
        <h3>Mountain Stats</h3>
        <div class="stat-grid">
          <div class="stat"><div class="v">${r.verticalDrop.toLocaleString()} ft</div><div class="l">Vertical Drop</div></div>
          <div class="stat"><div class="v">${r.acreage.toLocaleString()}</div><div class="l">Acres</div></div>
          <div class="stat"><div class="v">${r.trails}</div><div class="l">Trails</div></div>
          <div class="stat"><div class="v">${r.liftNum}</div><div class="l">Lifts</div></div>
          <div class="stat"><div class="v">${r.baseElevation.toLocaleString()}&ndash;${r.topElevation.toLocaleString()} ft</div><div class="l">Base &ndash; Summit</div></div>
          <div class="stat"><div class="v">${escapeHtml(r.abilityLow)}&ndash;${escapeHtml(r.abilityHigh)}</div><div class="l">Ability Range</div></div>
        </div>
      </div>

      <div class="panel-section">
        <h3>Peak Rating &mdash; <span style="color:var(--flag-orange)">${r.total}/100</span></h3>
        ${scoreRows}
      </div>

      <div class="panel-section" style="border-bottom:none;">
        <h3>Good to Know</h3>
        <div class="tag-row">
          <div class="pill">Lodging: ${escapeHtml(r.lodging || 'n/a')}</div>
          <div class="pill">Apr&egrave;s-ski: ${escapeHtml(r.apresSki || 'n/a')}</div>
          ${r.passAffiliation ? `<div class="pill">${escapeHtml(r.passAffiliation)}</div>` : ''}
        </div>
      </div>

      <div class="panel-cta">
        <a href="${r.website}" target="_blank" rel="noopener noreferrer">Visit ${escapeHtml(r.name)} &rarr;</a>
      </div>
    `;
    panelEl.classList.add('open');
  }

  panelEl.addEventListener('click', function (e) {
    if (e.target.matches('[data-close-panel]')) {
      panelEl.classList.remove('open');
    }
  });

  // "Peak Rating ->" / "View details ->" links inside hover cards open the panel
  document.addEventListener('click', function (e) {
    if (e.target.matches('[data-open-panel]')) {
      e.preventDefault();
      const name = e.target.dataset.resortName;
      const rated = e.target.dataset.rated === 'true';
      const source = rated ? RANKED : RESORTS;
      const match = source.find(r => r.name === name);
      if (match) openSidePanel(match, rated);
    }
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
