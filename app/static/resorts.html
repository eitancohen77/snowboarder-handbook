<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --ink: #2b2621;
    --muted: #6b6255;
    --card-bg: #fdfbf6;
    --card-line: #d8cfbf;
    --flag-orange: #d9622b;
    --dot: #003c6d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #16202c;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--ink);
  }

  header {
    text-align: center;
    padding: 20px 16px 14px;
  }

  header .eyebrow {
    color: var(--flag-orange);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 12px;
    font-weight: 700;
  }

  header h1 {
    font-size: 26px;
    margin: 6px 0 0;
    font-weight: 700;
    color: white;
  }

  header p {
    color: var(--muted);
    font-size: 13px;
    margin: 6px 0 0;
    color: rgba(255, 255, 255, 0.541)
  }

  #map {
    width: 100%;
    height: 82vh;
    min-height: 500px;
    background: #eae4d3;
  }

  /* Visible dot: small, purely decorative */
  .resort-dot-visual {
    fill: var(--dot);
    stroke: #000000;
    stroke-width: 1.5;
    pointer-events: none;
    transition: fill 0.12s ease;
  }

  /* Invisible larger circle underneath that actually catches the hover/click */
  .resort-dot-hit {
    fill: #000;
    fill-opacity: 0;
    stroke: none;
    cursor: pointer;
  }

  /* Hover card that appears under the circle */
  .resort-hover-card {
    background: var(--card-bg);
    border: 1px solid var(--card-line);
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    font-family: inherit;
    min-width: 160px;
  }
  .resort-hover-card .name {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .resort-hover-card .state {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .resort-hover-card a {
    display: inline-block;
    background: var(--flag-orange);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    padding: 5px 10px;
    border-radius: 6px;
  }
  .resort-hover-card a:hover {
    filter: brightness(1.08);
  }

  .leaflet-popup-content-wrapper {
    background: transparent;
    box-shadow: none;
    padding: 0;
  }
  .leaflet-popup-tip {
    display: none;
  }
  .leaflet-popup-content {
    margin: 0;
  }
  .leaflet-popup-close-button {
    display: none;
  }
</style>
</head>

  RESORTS.forEach(resort => {
    // Small visible dot (purely decorative, doesn't catch mouse events)
    L.circleMarker([resort.lat, resort.lon], {
      radius: 4,
      className: 'resort-dot-visual',
      weight: 1.5,
      interactive: false
    }).addTo(map);

    // Larger invisible circle on top — this is the actual hover/click target,
    // much easier to hit than the tiny visible dot.
    const hitTarget = L.circleMarker([resort.lat, resort.lon], {
      radius: 14,
      className: 'resort-dot-hit'
    }).addTo(map);

    const cardHtml = `
      <div class="resort-hover-card" data-resort-card>
        <div class="name">${escapeHtml(resort.name)}</div>
        <div class="state">${escapeHtml(resort.state)}</div>
        <a href="${resort.website}" target="_blank" rel="noopener noreferrer">Visit site &rarr;</a>
      </div>
    `;

    hitTarget.bindPopup(cardHtml, {
      closeButton: false,
      autoClose: false,
      closeOnClick: false,
      offset: [0, 10]
    });

    hitTarget.on('mouseover', function () {
      clearTimeout(closeTimer);
      // Only one card visible at a time: close whatever was open, instantly
      if (currentlyOpen && currentlyOpen !== this) {
        currentlyOpen.closePopup();
      }
      currentlyOpen = this;
      this.openPopup();
    });
    hitTarget.on('mouseout', function () {
      const marker = this;
      closeTimer = setTimeout(() => {
        marker.closePopup();
        if (currentlyOpen === marker) currentlyOpen = null;
      }, 150);
    });

    // Click: go straight to the resort's website
    hitTarget.on('click', function () {
      window.open(resort.website, '_blank', 'noopener,noreferrer');
    });
  });

  // Keep the card open if the mouse moves onto the card itself
  // (e.g. to click the "Visit site" link) instead of closing immediately.
  map.on('popupopen', function (e) {
    const el = e.popup.getElement();
    if (!el) return;
    el.addEventListener('mouseenter', () => clearTimeout(closeTimer));
    el.addEventListener('mouseleave', () => {
      closeTimer = setTimeout(() => {
        map.closePopup(e.popup);
        currentlyOpen = null;
      }, 150);
    });
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
